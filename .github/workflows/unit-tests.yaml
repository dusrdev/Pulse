name: Unit Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish native AOT test runner
        run: |
          dotnet publish tests/Pulse.Tests/Pulse.Tests.csproj -c Release -o "artifacts"

      - name: Run published tests
        shell: bash
        run: |
          out_dir="tests/Pulse.Tests/artifacts"
          exe="$out_dir/"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then exe="$exe.exe"; fi
          "$exe"
